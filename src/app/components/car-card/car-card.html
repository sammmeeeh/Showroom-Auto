<div class="auto-card">
    <div class="img-wrap">
        <img [src]="`images/${auto.photo}`" [alt]="auto.brand + ' ' + auto.model">
        <span class="badge" [class.low]="auto.availability <= 3">
            {{auto.availability}} in stock
        </span>
        <button type="button" class="heart" [class.active]="isFavorite"
            aria-label="Add to favorites" (click)="toggleFavorite()">
            <fa-icon [icon]="faHeart"></fa-icon>
        </button>
    </div>
    <div class="details">
        <p class="brand">{{auto.brand}}</p>
        <h3>{{auto.model}}</h3>
        <p class="power">
            Power: {{auto.power}} <br>
            Only {{auto.availability}} units in stock
        </p>
    </div>
    <div class="see_more">
        <span class="price">{{auto.price}} <small>DNT</small></span>
        <button type="button" class="more" (click)="seeMore()">See more..</button>
    </div>
</div>
